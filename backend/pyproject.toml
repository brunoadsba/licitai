[project]
name = "licitai-backend"
version = "0.1.0"
description = "Backend do Sistema de Análise de Termos de Referência (FastAPI)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
# Base conservadora: erros reais + imports não usados + ordenação + armadilhas comuns.
select = [
    "E4", "E7", "E9",   # subset de pycodestyle (erros)
    "F",                # pyflakes (variáveis/imports não usados, f-string sem placeholder)
    "I",                # isort (ordenação de imports)
    "B",                # flake8-bugbear (armadilhas)
]
ignore = [
    "B008", # FastAPI usa Depends() em defaults por design
]

[tool.ruff.lint.per-file-ignores]
# Scripts avulsos podem ter imports fora de ordem/variáveis soltas
"scripts/*" = ["I", "F401"]
