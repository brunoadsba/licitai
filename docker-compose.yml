services:
  # -------------------------------------------------------
  # Banco de Dados PostgreSQL com pgvector
  # -------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: sei-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sei_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-sei_analise}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sei_user} -d ${POSTGRES_DB:-sei_analise}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sei-network

  # -------------------------------------------------------
  # Backend — FastAPI
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sei-backend
    restart: unless-stopped
    # Ollama roda no host WSL (fora do Compose).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Sempre asyncpg + host `db` no Compose (não herdar DATABASE_URL do .env do host).
      DATABASE_URL: postgresql+asyncpg://sei_user:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sei_analise}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-open-mistral-nemo}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.8-27b:free}
      HF_API_KEY: ${HF_API_KEY:-}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen3-8B}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/v1}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      COHERE_MODEL: ${COHERE_MODEL:-command-r}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      POLLINATIONS_MODEL: ${POLLINATIONS_MODEL:-openai}
      POLLINATIONS_BASE_URL: ${POLLINATIONS_BASE_URL:-https://text.pollinations.ai/openai}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-Qwen/Qwen3-8B}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_MODEL: ${ZAI_MODEL:-glm-4.5-flash}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/paas/v4}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LONGCAT_API_KEY: ${LONGCAT_API_KEY:-}
      LONGCAT_MODEL: ${LONGCAT_MODEL:-LongCat-2.5-Preview}
      LONGCAT_BASE_URL: ${LONGCAT_BASE_URL:-https://api.longcat.chat/openai/v1}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-mimo-v2.6-flash-free}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-https://opencode.ai/inference/openai/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:32b}
      LLM_ALLOW_CLOUD: ${LLM_ALLOW_CLOUD:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      API_TOKEN: ${API_TOKEN:?Defina API_TOKEN no .env}
      APP_ENV: ${APP_ENV:-development}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-1}
      # Itens por chamada LLM: 1 = 1 call/item; 5 = bulk (~5x menos calls/tokens).
      ANALYSIS_BATCH_SIZE: ${ANALYSIS_BATCH_SIZE:-1}
      SUPERVISOR_REREVIEW_HIGH: ${SUPERVISOR_REREVIEW_HIGH:-true}
      MISS_HUNTER_ENABLED: ${MISS_HUNTER_ENABLED:-false}
      MISS_HUNTER_MAX_ITEMS: ${MISS_HUNTER_MAX_ITEMS:-10}
      # Piloto free tier: limita itens (~2 calls/item no economic)
      ANALYSIS_MAX_LLM_CALLS: ${ANALYSIS_MAX_LLM_CALLS:-24}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sei-network

  # -------------------------------------------------------
  # Worker — fila durável (análise, comparação, parse)
  # -------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sei-worker
    restart: unless-stopped
    # Ollama roda no host WSL (fora do Compose).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Teto anti PDF-bomba/OCR pesado (piloto single-user).
    mem_limit: 1g
    cpus: "1.0"
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://sei_user:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sei_analise}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-open-mistral-nemo}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.8-27b:free}
      HF_API_KEY: ${HF_API_KEY:-}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen3-8B}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/v1}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      COHERE_MODEL: ${COHERE_MODEL:-command-r}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      POLLINATIONS_MODEL: ${POLLINATIONS_MODEL:-openai}
      POLLINATIONS_BASE_URL: ${POLLINATIONS_BASE_URL:-https://text.pollinations.ai/openai}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-Qwen/Qwen3-8B}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_MODEL: ${ZAI_MODEL:-glm-4.5-flash}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/paas/v4}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LONGCAT_API_KEY: ${LONGCAT_API_KEY:-}
      LONGCAT_MODEL: ${LONGCAT_MODEL:-LongCat-2.5-Preview}
      LONGCAT_BASE_URL: ${LONGCAT_BASE_URL:-https://api.longcat.chat/openai/v1}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-mimo-v2.6-flash-free}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-https://opencode.ai/inference/openai/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:32b}
      API_TOKEN: ${API_TOKEN:?Defina API_TOKEN no .env}
      APP_ENV: ${APP_ENV:-development}
      LLM_ALLOW_CLOUD: ${LLM_ALLOW_CLOUD:-false}
      # Free tier: concorrência 1 reduz 429 TPM no Groq durante E2E/uso local
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-1}
      # Itens por chamada LLM: 1 = 1 call/item; 5 = bulk (~5x menos calls/tokens).
      ANALYSIS_BATCH_SIZE: ${ANALYSIS_BATCH_SIZE:-1}
      SUPERVISOR_REREVIEW_HIGH: ${SUPERVISOR_REREVIEW_HIGH:-true}
      MISS_HUNTER_ENABLED: ${MISS_HUNTER_ENABLED:-false}
      MISS_HUNTER_MAX_ITEMS: ${MISS_HUNTER_MAX_ITEMS:-10}
      ANALYSIS_MAX_LLM_CALLS: ${ANALYSIS_MAX_LLM_CALLS:-24}
    volumes:
      - ./backend/app:/app/app:ro
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check-db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - sei-network

  # -------------------------------------------------------
  # Frontend — Next.js
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Obrigatório no build: next.config.js embute BACKEND_URL nos rewrites.
        BACKEND_URL: http://backend:8000
        # Rastreabilidade da UI (up.sh exporta GIT_SHA; default dev fora do Compose).
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: sei-frontend
    restart: unless-stopped
    environment:
      # Runtime (BFF /api/proxy). Rewrites já usam o valor do build arg acima.
      BACKEND_URL: http://backend:8000
      # Vazio = browser usa caminhos relativos via BFF /api/proxy.
      NEXT_PUBLIC_API_URL: ""
      # Token apenas server-side (BFF). Nunca NEXT_PUBLIC_API_TOKEN.
      API_TOKEN: ${API_TOKEN:?Defina API_TOKEN no .env}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sei-network

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local

networks:
  sei-network:
    driver: bridge
