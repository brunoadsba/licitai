services:
  # -------------------------------------------------------
  # Banco de Dados PostgreSQL com pgvector
  # -------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: sei-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sei_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-sei_analise}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sei_user} -d ${POSTGRES_DB:-sei_analise}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sei-network

  # -------------------------------------------------------
  # Backend — FastAPI
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sei-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://sei_user:${POSTGRES_PASSWORD}@db:5432/sei_analise}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:32b}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sei-network

  # -------------------------------------------------------
  # Worker — fila durável (análise, comparação, parse)
  # -------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sei-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://sei_user:${POSTGRES_PASSWORD}@db:5432/sei_analise}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:32b}
      API_TOKEN: ${API_TOKEN:-}
      APP_ENV: ${APP_ENV:-development}
      LLM_ALLOW_CLOUD: ${LLM_ALLOW_CLOUD:-true}
    volumes:
      - ./backend/app:/app/app:ro
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - sei-network

  # -------------------------------------------------------
  # Frontend — Next.js
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sei-frontend
    restart: unless-stopped
    environment:
      # BACKEND_URL é usado pelos rewrites/BFF server-side do next.config.js:
      # sem ele o proxy cairia em 127.0.0.1 dentro do container (quebrado).
      BACKEND_URL: http://backend:8000
      # Vazio = browser usa caminhos relativos via BFF /api/proxy.
      NEXT_PUBLIC_API_URL: ""
      # Token apenas server-side (BFF). Nunca NEXT_PUBLIC_API_TOKEN.
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - backend
    networks:
      - sei-network

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local

networks:
  sei-network:
    driver: bridge
